name: Deploy Piano Path
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests.mjs
      - run: node tests-midi.mjs
      - run: node tests-curriculum.mjs
      - run: node tests-videos.mjs
      - run: node tests-assessment.mjs
      - run: |
          mkdir _site
          cp index.html style.css app.js falling-practice.js practice-assessment.js midi-file.js learning.js exercises.js piano-audio.js course.js curriculum.js curriculum-practice.js curriculum-progress.js curriculum-ui.js chapter-videos.js video-ui.js song-recommendations.js song-ui.js lesson-interactive.js config.js favicon.svg _site/
          cp -r samples _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
